<path class="link" d="M240 360 L240 295"/>
<text class="sub" x="40" y="590">S = (phase, remaining, current_period, entry_period, clock, 12 lamp booleans).</text>
<text class="sub" x="40" y="619">Countdown: (phase,r,p,e) → (phase,r−1,p′,e) khi r &gt; 1.</text>
<text class="sub" x="40" y="648">Đổi pha: (phase,1,p,e) → (next_phase,D(next_phase,p′),p′,p′).</text>
<text class="sub" x="40" y="677">Clock: 23:59:59 → 00:00:00; current_period lấy từ clock mới.</text>
<text class="sub" x="40" y="706">entry_period được chốt tại đầu pha; đổi khung giờ không cắt ngắn pha đang chạy.</text>
<text class="sub" x="40" y="735">JSON cho GUI: 1.012 trạng thái / 2.548 cạnh; giữ timer từng giây, chiếu clock xuống period.</text>
<text class="sub" x="40" y="764">JSON chính xác: 86.400 trạng thái / 86.400 cạnh; đầy đủ clock 24 giờ với cấu hình mặc định.</text>
<text class="sub" x="40" y="793">Mọi lamp ON/OFF được ghi rõ trong labeling, không chỉ dùng một biến phase.</text>
<text class="name" x="40" y="855">Thời lượng theo entry_period (giây)</text>
<text class="sub" x="40" y="884">MORNING_PEAK: NS_GREEN=45; EW_GREEN=35; YELLOW=3; ALL_RED=2</text>
<text class="sub" x="40" y="907">NORMAL: NS_GREEN=25; EW_GREEN=25; YELLOW=3; ALL_RED=2</text>
<text class="sub" x="40" y="930">EVENING_PEAK: NS_GREEN=35; EW_GREEN=45; YELLOW=3; ALL_RED=2</text>
<text class="sub" x="40" y="953">NIGHT_LOW: NS_GREEN=15; EW_GREEN=15; YELLOW=3; ALL_RED=2</text>
